name: Merge Guard

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  validate-source:
    name: Validate source branch
    runs-on: ubuntu-latest
    steps:
      - name: Only dev can merge into main
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [ "$BRANCH" != "dev" ]; then
            echo ""
            echo "  Direct merges to main are not allowed."
            echo "  Source branch: '$BRANCH'"
            echo ""
            echo "  Merge your branch into 'dev' first, then open a PR from dev -> main."
            echo ""
            exit 1
          fi
          echo "Source branch 'dev' -> main is allowed."
