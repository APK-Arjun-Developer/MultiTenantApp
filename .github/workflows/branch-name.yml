name: Branch Name

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened]

jobs:
  validate:
    name: Validate branch name
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          exempt='^(main|dev|dependabot/.+)$'
          pattern='^(feat|fix|ci|chore|docs|refactor|test|perf|hotfix)/[a-z0-9][a-z0-9-]*$'

          if echo "$BRANCH" | grep -qE "$exempt"; then
            echo "Branch '$BRANCH' is exempt from naming validation."
            exit 0
          fi

          if ! echo "$BRANCH" | grep -qE "$pattern"; then
            echo ""
            echo "  Invalid branch name: '$BRANCH'"
            echo ""
            echo "  Required: <type>/<kebab-case-description>"
            echo "  Types:    feat | fix | ci | chore | docs | refactor | test | perf | hotfix"
            echo "  Example:  feat/tenant-wizard-cancel"
            echo ""
            exit 1
          fi

          echo "Branch name '$BRANCH' is valid."
