# Display name shown everywhere in SonarCloud.
sonar.projectName=MultiTenantApp

# Key must be unique across all of SonarCloud, so it carries the organization prefix.
# It matches the key SonarCloud generates when importing the GitHub repo MultiTenantApp.
sonar.projectKey=APK-Arjun-Developer_MultiTenantApp
sonar.organization=apk-arjun-developer

# Source files (app code only; tests and type-only files excluded)
sonar.sources=src
sonar.exclusions=src/__tests__/**,src/**/*.test.ts,src/**/*.test.tsx,src/main.tsx,src/vite-env.d.ts

# Test files
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx

# Coverage reports: unit (vitest --coverage) + E2E (playwright, E2E_COVERAGE=true); Sonar merges them
sonar.javascript.lcov.reportPaths=coverage/lcov.info,coverage-e2e/lcov.info
sonar.coverage.exclusions=src/**/types.ts,src/**/*.types.ts,src/types/**,src/**/*.styles.ts,src/**/styles.ts

# TypeScript config
sonar.typescript.tsconfigPaths=tsconfig.app.json,tsconfig.test.json

# Encoding
sonar.sourceEncoding=UTF-8

# Wait for the Quality Gate result and fail the workflow when it fails.
sonar.qualitygate.wait=true
